<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Theophysics TTS</title><style>body{font-family:system-ui;margin:2rem}textarea{width:100%;height:12rem}button{padding:.7rem 1rem;margin:.5rem .5rem .5rem 0}.spinner{color:#2563eb}</style></head><body><h1>TTS Engine</h1><textarea id="ttsText" placeholder="Enter text to synthesize"></textarea><br><button id="generateBtn">Generate</button><button id="downloadBtn" disabled>Download</button><p id="status"></p><script>
const API='http://192.168.1.76:3456';let blobUrl='';
document.getElementById('generateBtn').addEventListener('click',async()=>{const text=document.getElementById('ttsText').value;const status=document.getElementById('status');const btn=document.getElementById('generateBtn');status.className='spinner';status.textContent='Generating speech...';btn.disabled=true;try{const response=await fetch(`${API}/api/tts`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!response.ok)throw new Error(await response.text());const blob=await response.blob();if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(blob);const audio=new Audio(blobUrl);await audio.play();document.getElementById('downloadBtn').disabled=false;status.className='';status.textContent='Speech generated.';}catch(e){status.className='';status.textContent=`TTS failed: ${e.message}`;}finally{btn.disabled=false;}});
document.getElementById('downloadBtn').addEventListener('click',()=>{if(!blobUrl)return;const a=document.createElement('a');a.href=blobUrl;a.download='theophysics-tts.mp3';document.body.appendChild(a);a.click();a.remove();});
</script></body></html>
